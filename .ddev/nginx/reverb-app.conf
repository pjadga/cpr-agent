# Reverb on the app's own origin, matching how a Herd (or any single-origin)
# install is set up. The base site config includes this directory from inside
# its server block, so nothing in the #ddev-generated file needs editing.
#
# pusher-js connects to /app/{key}, so this one rule is all that is needed for
# the browser to reach the WebSocket over https://cyberpunk.ddev.site with no
# second port, no VITE_REVERB_* and no Reverb settings in the Foundry Bridge.
#
# Reverb binds 127.0.0.1:8085 inside this same web container.
location /app/ {
    proxy_pass http://127.0.0.1:8085;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
