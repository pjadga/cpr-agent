# GitLab CI/CD Pipeline for Cyberpunk Agent
# Runs tests on every push and merge request

stages:
  - build
  - test
  - lint
  - package

variables:
  # Set specific cache directories for package managers
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm-cache"

# Cache internal download directories, not the project output folders
.composer-cache: &composer-cache
  cache:
    key: composer-$CI_COMMIT_REF_SLUG
    paths:
      - .composer-cache/

.npm-cache: &npm-cache
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths:
      - .npm-cache/

# ============================================
# Build Stage
# ============================================

composer:
  stage: build
  image: php:8.4-cli
  <<: *composer-cache
  before_script:
    - apt-get update && apt-get install -y git unzip libzip-dev libpng-dev
    - docker-php-ext-install pdo_mysql zip bcmath gd
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  script:
    - composer install --prefer-dist --no-ansi --no-interaction --no-progress
  artifacts:
    paths:
      - vendor/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

npm:
  stage: build
  image: node:20-alpine
  <<: *npm-cache
  script:
    - npm ci --prefer-offline
    - npm run build
  artifacts:
    paths:
      - node_modules/
      - public/build/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ============================================
# Test Stage
# ============================================

# Common before_script for all PHP tests
.php-test-setup: &php-test-setup
  before_script:
    - apt-get update && apt-get install -y git unzip libzip-dev libpng-dev libsqlite3-dev curl
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
    - docker-php-ext-install pdo_sqlite zip bcmath gd
    - cp .env.example .env 2>/dev/null || cp .env.template .env 2>/dev/null || touch .env
    - grep -q "^APP_KEY=" .env || echo "APP_KEY=" >> .env
    - pecl install redis
    - docker-php-ext-enable redis
    - php artisan key:generate --no-interaction
    - php artisan config:clear
    - npm install
    - npm run build

# Run only on the default branch (e.g., main/master) to avoid double-running on MRs
phpunit:
  stage: test
  image: php:8.4-cli
  needs:
    - composer
  <<: *php-test-setup
  script:
    # Added the --log-junit flag to actually generate the artifact
    - php vendor/bin/phpunit --colors=always --log-junit storage/logs/junit.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Run only unit tests on Merge Requests
phpunit:unit:
  stage: test
  image: php:8.4-cli
  needs:
    - composer
  <<: *php-test-setup
  script:
    - php vendor/bin/phpunit --testsuite=Unit --colors=always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Run only feature tests on Merge Requests
phpunit:feature:
  stage: test
  image: php:8.4-cli
  needs:
    - composer
    - npm
  <<: *php-test-setup
  script:
    - php vendor/bin/phpunit --testsuite=Feature --colors=always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

vitest:
  stage: test
  image: node:20-alpine
  needs:
    - npm
  script:
    - npx vitest --run
  artifacts:
    when: always
    paths:
      - coverage/
    expire_in: 1 week
  # Must match the rules on the job it needs. A tag pipeline does not set
  # CI_COMMIT_BRANCH, so npm is absent there, and a needs: on a job that does
  # not exist makes the whole pipeline config invalid rather than just skipping.
  # Tags build a release from code that was already tested on its branch.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ============================================
# Lint Stage
# ============================================

pint:
  stage: lint
  image: php:8.4-cli
  needs:
    - composer
  before_script:
    - apt-get update && apt-get install -y git unzip libzip-dev
    - docker-php-ext-install zip
  script:
    - php vendor/bin/pint --test
  allow_failure: true
  # See the note on vitest: these rules must match the composer job this needs.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

eslint:
  stage: lint
  image: node:20-alpine
  needs:
    - npm
  script:
    - npm run lint 2>/dev/null || echo "ESLint not configured, skipping"
  allow_failure: true
  # See the note on vitest: these rules must match the npm job this needs.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ============================================
# Package Stage
# ============================================
#
# The Windows installer cannot be built here: frankenphp.exe is a Windows
# binary and Inno Setup only runs on Windows. So CI does the half it can, which
# is the slow half, and the packaging itself stays a manual step on a Windows
# machine. See standalone/windows/README.md.

# The packaging script copies these files by path. A rename would otherwise go
# unnoticed until someone tried to cut a release weeks later, on their desktop,
# by hand. Failing here costs seconds instead.
standalone:check:
  stage: package
  image: alpine:3.20
  needs: []
  script:
    - |
      set -eu

      for file in \
        standalone/php.ini-windows \
        standalone/Caddyfile \
        .env.standalone.example \
        standalone/windows/build-bundle.ps1 \
        standalone/windows/cpr-agent.iss \
        standalone/windows/launcher.ps1 \
        standalone/windows/stop.ps1
      do
        if [ ! -f "$file" ]; then echo "Missing packaging input: $file"; exit 1; fi
      done
      echo "All Windows packaging inputs present."
    - |
      set -eu

      # build-bundle.ps1 copies an explicit list of top level directories. A new
      # one that nobody adds to that list is silently missing from the bundle,
      # and the failure only shows up on a user's machine after a release. So
      # every top level directory must be named in one list or the other.
      #
      # Patterns omit the leading $ because GitLab would try to expand it.
      script=standalone/windows/build-bundle.ps1

      sed -n '/include = @(/,/^)/p' "$script"           | grep -o "'[^']*'" | tr -d "'"  > /tmp/known
      sed -n '/excludeFromBundle = @(/,/^)/p' "$script" | grep -o "'[^']*'" | tr -d "'" >> /tmp/known
      sort -u /tmp/known -o /tmp/known

      # Dot directories are tooling and never shipped; ls skips them already.
      ls -d */ 2>/dev/null | sed 's#/$##' | sort -u > /tmp/actual

      missing=$(comm -23 /tmp/actual /tmp/known)

      if [ -n "$missing" ]; then
        echo "These top level directories appear in neither list in $script:"
        echo "$missing" | sed 's/^/  /'
        echo
        echo "Add each to \$include (ship it) or \$excludeFromBundle (do not),"
        echo "otherwise the Windows bundle silently ships without them."
        exit 1
      fi

      echo "Every top level directory is accounted for in the bundle lists."
  # Tags included: a release build is exactly when a silently incomplete bundle
  # does the most damage, so the guard has to run there too.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# Builds exactly what `build-bundle.ps1 -SkipDependencies` expects, so the
# Windows box never has to run Composer or npm. Download this artifact, unpack
# it into a checkout, and the packaging step is two commands.
#
# Automatic on tags. Manual on branches, because it is slow and only needed
# when you actually intend to cut a build.
standalone:windows-inputs:
  stage: package
  image: php:8.4-cli
  # Gated on the guard: building a release bundle that is missing a directory
  # is worse than not building one. standalone:check runs in every pipeline
  # this job runs in, so the dependency is always satisfiable.
  needs:
    - standalone:check
  <<: *composer-cache
  before_script:
    - apt-get update && apt-get install -y git unzip libzip-dev libpng-dev curl
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
    - docker-php-ext-install pdo_sqlite zip bcmath gd
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  script:
    # --no-dev matches what ships: the bundle must not carry phpunit or faker.
    - composer install --no-dev --optimize-autoloader --no-ansi --no-interaction --no-progress
    - npm ci --prefer-offline
    - npm run build
    - test -f public/build/manifest.json
  artifacts:
    name: "cpr-agent-windows-inputs-$CI_COMMIT_REF_SLUG"
    paths:
      - vendor/
      - public/build/
    expire_in: 1 month
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
